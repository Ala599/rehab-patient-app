<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test de détection de mouvement</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <header>
      <h1>Flexion du coude</h1>
      <p id="status" role="status">Choisissez le côté atteint, puis démarrez la caméra.</p>
    </header>

    <div class="controls">
      <label for="side">Côté atteint</label>
      <select id="side">
        <option value="right">Droit</option>
        <option value="left">Gauche</option>
      </select>
      <button id="start" class="primary" type="button">Démarrer la caméra</button>
      <button id="stop" type="button" disabled>Arrêter</button>
    </div>

    <div class="stage">
      <video id="video" playsinline muted></video>
      <canvas id="overlay" aria-hidden="true"></canvas>
    </div>

    <p id="message" class="message" aria-live="polite">Pliez puis dépliez le coude</p>

    <dl class="stats">
      <div><dt>Répétitions</dt><dd id="reps">0 / 10</dd></div>
      <div><dt>Coude côté atteint</dt><dd id="angle-main">–</dd></div>
      <div><dt>Coude autre côté</dt><dd id="angle-other">–</dd></div>
    </dl>

    <div class="controls">
      <button id="reset" type="button">Recommencer la série</button>
      <button id="export" type="button" disabled>Exporter la séance (JSON)</button>
    </div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
